spring.application.name=discovery
server.port=8761
# =========================================================================
# CONFIGURATION EUREKA SERVER
# =========================================================================
# Eureka Server ne doit pas s'enregistrer lui-même ni chercher de registre
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Désactive complètement les tentatives de réplication entre pairs (mode standalone)
eureka.server.enable-peer-replication=false
# Mode développement / Kubernetes : désactive le mode auto-préservation
# Évite qu'Eureka garde indéfiniment des pods Kubernetes qui ont été détruits
eureka.server.enable-self-preservation=false
# Nettoie les instances mortes toutes les 5 secondes (au lieu de 60s)
eureka.server.eviction-interval-timer-in-ms=5000
# =========================================================================
# ACTUATOR & HEALTHCHECKS (Indispensable pour Kubernetes Probes)
# =========================================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.initial-interval=3000
spring.cloud.config.retry.max-attempts=6
spring.flyway.connect-retries=20