# =========================================================
# DATA SOURCE H2 (MEMORY)
# =========================================================
spring.datasource.url=jdbc:h2:mem:user-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# =========================================================
# H2 CONSOLE
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# IMPORTANT pour Spring Security (si présent)
spring.h2.console.settings.web-allow-others=true
# =========================================================
# HIBERNATE / JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=PUBLIC
# logs SQL
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#logging.level.org.hibernate.tool.schema=DEBUG
# =========================================================
# INITIALISATION SQL (IMPORTANT FIX)
# =========================================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql
# =========================================================
# HIKARI POOL (optionnel mais OK)
# =========================================================
spring.datasource.hikari.pool-name=H2-Pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000