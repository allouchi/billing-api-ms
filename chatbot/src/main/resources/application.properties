spring.application.name=chatbot
server.port=8686
# =========================================================================
# CONFIGURATION CLIENT MCP (MODE ASYNC / SSE NETWORKING)
# ========================================================================
# 🛠️ CORRECTION : On retire la ligne server.webmvc.base-path d'ici !
# Force le mode asynchrone (Webflux/WebClient) pour écouter le flux SSE
spring.ai.mcp.client.type=async
# Active la conversion automatique des outils MCP pour l'AIAgent
spring.ai.mcp.client.toolcallback.enabled=true
# 🛠️ CORRECTION : Syntaxe exacte attendue par l'auto-configuration client de Spring AI
spring.ai.mcp.client.connections.client-mcp-server.uri=${MCP_CONNECTION_URI_MCP:http://localhost:7000/mcp/message}
spring.ai.mcp.client.connections.client-mcp-server.sse-url=${MCP_CONNECTION_URL_SSE:http://localhost:7000/mcp/sse}
# Laisse le temps au handshake réseau Docker de s'établir
spring.ai.mcp.client.request-timeout=90s
# =========================================================================
# CONFIGURATION OLLAMA
# =========================================================================
spring.ai.ollama.base-url=${LLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-ctx=4096
# =========================================================================
# MONITORING & ACTUATOR
# =========================================================================
spring.devtools.restart.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
# =========================================================================
# SERVICE DISCOVERY (EUREKA)
# =========================================================================
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.lease-renewal-interval-in-seconds=3
eureka.instance.lease-expiration-duration-in-seconds=5
# =========================================================================
# SÉCURITÉ
# =========================================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URL:http://localhost:3000/api/public-key/jwks.json}
spring.ai.ollama.chat.options.max-tool-calls=5
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=TRACE

