apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: billing-db
  name: billing-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: billing-db
    spec:
      containers:
        - args:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_PASSWORD
              value: app_pass
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_USER
              value: app_user
          image: mysql:8.0
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -proot
            failureThreshold: 60
            periodSeconds: 10
            initialDelaySeconds: 45
            timeoutSeconds: 5
          name: billing-db
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d
              name: sql-init-volume
      restartPolicy: Always
      volumes:
        - name: sql-init-volume
          configMap:
            name: billing-db-cm0
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: billing-db
  name: billing-db
spec:
  type: ClusterIP # 🟢 Plus adapté pour une DB interne (pas besoin de LoadBalancer ici)
  ports:
    - name: mysql
      port: 3306        # 🟢 Remis sur 3306 pour que "billing-db:3306" fonctionne directement
      targetPort: 3306
  selector:
    app: billing-db