# =========================================================================
# SERVICE DISCOVERY (EUREKA)
# =========================================================================
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://discovery-service:8761/eureka}
# Active la création automatique des routes via Eureka
spring.cloud.gateway.discovery.locator.enabled=true
# Force la Gateway à chercher les noms de services en minuscules dans l'URL
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# =========================
# CONFIG
# =========================
#spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8888}
#spring.cloud.config.enabled=false
#spring.cloud.config.import-check.enabled=false
# =========================================================================
# 1. CONNEXION BBD (PORT 3307 COMPATIBLE K8S / DEV LOCAL VIA ENV)
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://billing-db:3306/prestation-db?serverTimezone=UTC&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_pass}
# =========================================================================
# 2. STRATÉGIE DE BASE DE DONNÉES (FLYWAY UNIQUE, HIBERNATE PASSIF)
# =========================================================================
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# =========================================================================
# 3. LOGS INDISPENSABLES (TRACE FLYWAY + REQUÊTES SQL BRUTES ET VALEURS)
# =========================================================================
#logging.level.org.flywaydb=DEBUG
spring.jpa.show-sql=false
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.open-in-view=false
# =========================================================================
# 4. SÉCURITÉ ACTUATOR (INDISPENSABLE POUR KUBERNETES)
# =========================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
# =========================================================================
#  5. SECRET-KEY
# =========================================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URL:http://localhost:3000/authent/api/public-key/jwks.json}
spring.main.allow-bean-definition-overriding=true
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.initial-interval=3000
spring.cloud.config.retry.max-attempts=6
spring.flyway.connect-retries=20