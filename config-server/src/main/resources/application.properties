server.port=8888
spring.application.name=config-server
#spring.cloud.config.server.git.uri=${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:https://github.com/allouchi/config-repo.git}
#spring.cloud.config.server.git.username=allouchi@hotmail.fr
#spring.cloud.config.server.git.password=Maroc2026$!!
spring.profiles.active=native
# On indique à Spring de chercher les fichiers de config dans le dossier /app/config-repo du conteneur
spring.cloud.config.server.native.search-locations=file:/app/config-repo
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
spring.cloud.discovery.enabled=true
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.org.springframework.cloud=DEBUG