apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: discovery-service
  name: discovery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: discovery-service
  template:
    metadata:
      annotations:
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: discovery-service
    spec:
      containers:
        - image: discovery-service
          imagePullPolicy: Never
          # =========================================================================
          # 🟢 FORCER LE MODE STANDALONE (Évite les boucles de réplication réseau)
          # =========================================================================
          env:
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: EUREKA_SERVER_ENABLE_SELF_PRESERVATION
              value: "false"
          # =========================================================================
          # SÉCURITÉ DE DÉMARRAGE : Laisse le temps à Eureka de se lancer (3 minutes max)
          # =========================================================================
          startupProbe:
            httpGet:
              path: /
              port: 8761
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 5
          # =========================================================================
          # VÉRIFICATION DE ROUTINE : S'assure qu'Eureka reste en vie
          # =========================================================================
          livenessProbe:
            httpGet:
              path: /
              port: 8761
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 5
          name: discovery-service
          ports:
            - containerPort: 8761
              protocol: TCP
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: discovery-service
  name: discovery-service
spec:
  ports:
    - name: "8761"
      port: 8761
      targetPort: 8761
  selector:
    io.kompose.service: discovery-service