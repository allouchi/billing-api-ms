services:
  # =========================================================================
  # OLLAMA (IA & LLM)
  # =========================================================================
  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 10s # 💡 Augmenté légèrement pour laisser le temps au processus de démarrer
    volumes:
      - ollama_data:/root/.ollama # 🔥 Changé en volume nommé (voir explication ci-dessous)
    networks:
      - sbatec-net

  # =========================================================================
  # OPEN WEBUI (Interface Graphique pour Ollama)
  # =========================================================================
  open-webui-service:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-service
    restart: unless-stopped
    ports:
      - "2000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-service:11434
    volumes:
      - ./webui_data:/app/backend/data
    depends_on:
      ollama-service:
        condition: service_healthy
    networks:
      - sbatec-net

  # =========================================================================
  #  SINGLE DATABASE SERVER
  # =========================================================================
  billing-db:
    image: mysql:8.0
    container_name: billing-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3306:3306"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - mysql_global_data:/var/lib/mysql
    networks:
      - sbatec-net
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # DISCOVERY (EUREKA)
  # =========================================================================
  discovery-service:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      retries: 4
    networks:
      - sbatec-net

  # =========================================================================
  # GATEWAY
  # =========================================================================
  gateway-service:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "8181:8181"
      - "5001:5001"
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5001
      - SPRING_APPLICATION_NAME=gateway
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - JWK_SET_URL=http://authent-service:3000/api/public-key/jwks.json
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8181/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - sbatec-net

  # =========================
  # CONFIG SERVER
  # =========================
  config-service:
    build:
      context: ./config
      dockerfile: Dockerfile
    container_name: config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config-repo
    volumes:
      - ./config-repo:/app/config-repo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - sbatec-net

  # =========================================================================
  # AUTHENT SERVICE
  # =========================================================================
  authent-service:
    build:
      context: ./authent
      dockerfile: Dockerfile
    container_name: authent-service
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5002:5002"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5002
      - SPRING_APPLICATION_NAME=authent
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://billing-db:3306/user-db?serverTimezone=UTC&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_pass
    depends_on:
      billing-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - sbatec-net

  # =========================================================================
  # COMPANY SERVICE
  # =========================================================================
  company-service:
    build:
      context: ./company
      dockerfile: Dockerfile
    container_name: company-service
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5003:5003"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5003
      - JWK_SET_URL=http://authent-service:3000/api/public-key/jwks.json
      - SPRING_APPLICATION_NAME=company
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://billing-db:3306/company-db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_pass
    depends_on:
      billing-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - sbatec-net

  # =========================================================================
  # PRESTATION SERVICE
  # =========================================================================
  prestation-service:
    build:
      context: ./prestation
      dockerfile: Dockerfile
    container_name: prestation-service
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "5004:5004"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - SPRING_APPLICATION_NAME=prestation
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5004
      - JWK_SET_URL=http://authent-service:3000/api/public-key/jwks.json
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://billing-db:3306/prestation-db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_pass
    depends_on:
      billing-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - sbatec-net

  # =========================================================================
  # CONSULTANT SERVICE
  # =========================================================================
  consultant-service:
    build:
      context: ./consultant
      dockerfile: Dockerfile
    container_name: consultant-service
    restart: unless-stopped
    ports:
      - "6000:6000"
      - "5006:5006"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6000/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - SPRING_APPLICATION_NAME=consultant
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      - JWK_SET_URL=http://authent-service:3000/api/public-key/jwks.json
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://billing-db:3306/consultant-db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_pass
    depends_on:
      billing-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - sbatec-net

  # =========================================================================
  # FACTURE SERVICE
  # =========================================================================
  facture-service:
    build:
      context: ./facture
      dockerfile: Dockerfile
    container_name: facture-service
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5007:5007"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
      - JWK_SET_URL=http://authent-service:3000/api/public-key/jwks.json
      - SPRING_APPLICATION_NAME=facture
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://billing-db:3306/facture-db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_pass
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_BCC=${MAIL_BCC}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
    volumes:
      - C:/temp/pdf:/data/pdf
      - C:/temp/csv:/data/csv
      - C:/temp/libelles:/data/libelle-facture
    depends_on:
      billing-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - sbatec-net

  # =========================================================================
  # CLIENT SERVICE
  # =========================================================================
  client-service:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client-service
    restart: unless-stopped
    ports:
      - "7000:7000"
      - "5005:5005"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7000/actuator/health" ]
      #test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7000/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    environment:
      - SERVER_ADDRESS=0.0.0.0
      - SPRING_APPLICATION_NAME=client
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - JWK_SET_URL=http://authent-service:3000/api/public-key/jwks.json
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://billing-db:3306/client-db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_pass
    depends_on:
      billing-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - sbatec-net
  # =========================================================================
  # CHATBOT SERVER (IA Orchestrator)
  # =========================================================================
  chatbot-service:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: chatbot-service
    restart: unless-stopped
    ports:
      - "8686:8686"
      - "5008:5008"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8686/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008
      - SPRING_APPLICATION_NAME=chatbot
      - DISCOVERY_SERVICE_URL=http://discovery-service:8761/eureka
      - LLAMA_URL=http://ollama-service:11434
      - JWK_SET_URL=http://authent-service:3000/api/public-key/jwks.json
      - MCP_CONNECTION_URI_MCP=http://client-service:7000/mcp/message
      - MCP_CONNECTION_URL_SSE=http://client-service:7000/mcp/sse
    depends_on:
      ollama-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      client-service:
        condition: service_healthy  # Attend que le healthcheck long du client-service passe au vert !
    networks:
      - sbatec-net

  # =========================================================================
  # ANGULAR FRONTEND
  # =========================================================================
  front-service:
    build:
      context: ../bill-front-ng
    image: front-service
    container_name: front-service
    restart: unless-stopped
    ports:
      - "4201:80"
    networks:
      - sbatec-net

# =========================================================================
# CONFIGURATIONS GLOBALES
# =========================================================================
volumes:
  mysql_global_data:
  ollama_data:

networks:
  sbatec-net:
    driver: bridge
