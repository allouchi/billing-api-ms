# =========================================================================
# SERVER
# =========================================================================
server.port=8181
spring.application.name=gateway
# =========================================================================
# EUREKA & ROUTING TYPE
# =========================================================================
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# Désactivé pour éviter que les routes automatiques entrent en conflit avec vos filtres StripPrefix
spring.cloud.gateway.discovery.locator.enabled=false
# ⚡ Rafraîchissement ultra-rapide du cache local de la Gateway (5 secondes au lieu de 30)
eureka.client.registry-fetch-interval-seconds=5
# =========================================================================
# GLOBAL CORS CONFIGURATION
# =========================================================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
# =========================================================================
# ROUTE 0 : AUTHENT
# =========================================================================
spring.cloud.gateway.routes[0].id=authent-route-fix
spring.cloud.gateway.routes[0].uri=lb://authent
spring.cloud.gateway.routes[0].predicates[0]=Path=/authent/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
# =========================================================================
# ROUTE 1 : COMPANY (Avec correctif anti-NoRouteToHostException)
# =========================================================================
spring.cloud.gateway.routes[1].id=company-route-fix
spring.cloud.gateway.routes[1].uri=lb://company
spring.cloud.gateway.routes[1].predicates[0]=Path=/company/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
# Configuration du filtre Retry pour la résilience
spring.cloud.gateway.routes[1].filters[1].name=Retry
spring.cloud.gateway.routes[1].filters[1].args.retries=3
spring.cloud.gateway.routes[1].filters[1].args.statuses=INTERNAL_SERVER_ERROR
spring.cloud.gateway.routes[1].filters[1].args.exceptions=java.net.NoRouteToHostException,java.net.ConnectException,io.netty.channel.ConnectTimeoutException
