# =========================================================================
# SERVER
# =========================================================================
server.port=8181
spring.application.name=gateway
# =========================================================================
# EUREKA
# =========================================================================
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=false
# =========================================================================
# ROUTES
# =========================================================================
spring.cloud.gateway.server.webflux.routes[0].id=authent-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://authent
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/authent/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].id=company-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://company
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/company/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].id=client-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://client
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/client/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[3].id=consultant-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://consultant
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/consultant/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[4].id=prestation-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://prestation
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/prestation/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[5].id=facture-route
spring.cloud.gateway.server.webflux.routes[5].uri=lb://facture
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/facture/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1
logging.level.org.springframework.security=DEBUG
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URL:http://localhost:3000/authent/api/public-key/jwks.json}
