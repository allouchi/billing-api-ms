# =========================================================================
# 1. CONNEXION BBD (PORT 3306 COMPATIBLE K8S / DEV LOCAL VIA ENV)
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://billing-db:3306/user-db?serverTimezone=UTC&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_pass}
# =========================================================================
# 2. STRATÉGIE DE BASE DE DONNÉES (FLYWAY UNIQUE, HIBERNATE PASSIF)
# =========================================================================
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# =========================================================================
# 3. LOGS INDISPENSABLES (TRACE FLYWAY + REQUÊTES SQL BRUTES ET VALEURS)
# =========================================================================
logging.level.org.flywaydb=DEBUG
spring.jpa.show-sql=false
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# =========================================================================
# 4. SÉCURITÉ ACTUATOR (INDISPENSABLE POUR KUBERNETES)
# =========================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always