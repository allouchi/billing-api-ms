server.port=7000
# =========================================================================
# CONFIGURATION SERVEUR MCP (EXPOSITION DES OUTILS EN SSE)
# =========================================================================
# En version M6, on active explicitement le serveur au format WebMVC (HTTP/SSE)
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.webmvc.enabled=true
# Le chemin racine où le chatbot viendra chercher les outils (ex: http://client-service:7000/mcp)
spring.ai.mcp.server.webmvc.base-path=/mcp
# ❌ TOUTES LES PROPRIÉTÉS "spring.ai.mcp.client.*" ONT ÉTÉ SUPPRIMÉES D'ICI
# =========================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (Pour vos outils ClientServiceImpl)
# =========================================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/billing_db}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# =========================================================================
# MONITORING & ACTUATOR
# =========================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
# =========================================================================
# SERVICE DISCOVERY (EUREKA)
# =========================================================================
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.lease-renewal-interval-in-seconds=3
eureka.instance.lease-expiration-duration-in-seconds=5
# =========================================================================
# SÉCURITÉ
# =========================================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URL:http://localhost:3000/api/public-key/jwks.json}
logging.level.com.sbatec.client=DEBUG
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http=DEBUG
logging.level.org.apache.coyote=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=TRACE

