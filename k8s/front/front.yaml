apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-service
  labels:
    app: front-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-service
  template:
    metadata:
      labels:
        app: front-service
    spec:
      containers:
        - name: front-service
          image: front-service-image
          ports:
            - containerPort: 80
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: front-service
  labels:
    app: front-service
spec:
  # ============================================================
  # MODIFICATION : En LoadBalancer pour l'accès local
  # ============================================================
  type: LoadBalancer
  ports:
    - name: "http"
      port: 4200          # Accessible sur http://localhost
      targetPort: 80    # Port interne du conteneur Nginx/Angular
  selector:
    app: front-service