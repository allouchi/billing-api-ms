server.port=8888
spring.application.name=config
spring.profiles.active=native
# On indique à Spring de chercher les fichiers de config dans le dossier /app/config-repo du conteneur
spring.cloud.config.server.native.search-locations=file:/app/config-repo
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
logging.level.org.springframework.cloud=DEBUG
# Force l'affichage des requêtes SQL générées par Hibernate en arrière-plan
logging.level.org.hibernate.SQL=DEBUG
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.initial-interval=3000
spring.cloud.config.retry.max-attempts=6
spring.flyway.connect-retries=20