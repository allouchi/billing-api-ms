apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: client-service
  name: client-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-service
  template:
    metadata:
      labels:
        app: client-service
    spec:
      containers:
        - env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: DISCOVERY_SERVICE_URL
              value: http://discovery-service:8761/eureka
            - name: SPRING_APPLICATION_NAME
              value: "client"
            - name: SPRING_DATASOURCE_PASSWORD
              value: app_pass
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://billing-db:3307/client-db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
            - name: SPRING_DATASOURCE_USERNAME
              value: app_user
          image: client-service
          imagePullPolicy: Never
          name: client-service
          ports:
            - containerPort: 7000
              protocol: TCP

          # ============================================================
          # 1. SONDE DE DÉMARRAGE (Laisse le temps à Flyway et Hibernate)
          # ============================================================
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 15

          # ============================================================
          # 2. SONDE DE VIE (Prend le relais une fois le démarrage réussi)
          # ============================================================
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 7000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: client-service
  name: client-service
spec:
  ports:
    - name: "7000"
      port: 7000
      targetPort: 7000
  selector:
    app: client-service