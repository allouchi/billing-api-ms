# =========================
# MYSQL (Adapté pour Kubernetes)
# =========================
# Remplacement de localhost:3306 par le nom du service K8s (billing-db) et le port interne (3306)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://billing-db:3306/company-db?serverTimezone=UTC&createDatabaseIfNotExist=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# =========================
# HIBERNATE
# =========================
# Note : MySQL8Dialect est déprécié dans les versions récentes de Hibernate (Spring Boot 3.x),
# utiliser MySQLDialect est plus générique et robuste, mais vous pouvez laisser MySQL8Dialect si nécessaire.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

