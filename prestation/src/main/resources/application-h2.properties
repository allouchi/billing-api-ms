# ===================================================================
# Base de données H2 (Configuration Mémoire)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:facture-db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# Interface Graphique H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# ===================================================================
# Pool de connexions HikariCP
# ===================================================================
spring.datasource.hikari.pool-name=H2-HikariPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.auto-commit=true
# ===================================================================
# JPA / Hibernate
# ===================================================================
# Laissé vide pour laisser Hibernate 6 détecter automatiquement le dialecte H2 moderne
# 'create-drop' garantit que les tables sont créées à chaque démarrage pour accueillir le data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.autocommit=true
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.jpa.properties.hibernate.event.merge.entity_copy_observer=allow
# ===================================================================
# Initialisation des données (Ordre d'exécution corrigé)
# ===================================================================
# 'embedded' cible uniquement les bases en mémoire comme H2
spring.sql.init.mode=embedded
# FORCE Spring Boot à attendre qu'Hibernate ait créé les tables avant de lancer le data.sql
spring.jpa.defer-datasource-initialization=false
# Emplacement de ton script d'insertion
spring.sql.init.data-locations=classpath:data.sql
# ===================================================================
# Configuration de l'Application & Outils
# ===================================================================
spring.devtools.restart.log-condition-evaluation-delta=false
# ===================================================================
# Actuator (Monitoring)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always