apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: prestation-service
  name: prestation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prestation-service
  template:
    metadata:
      labels:
        app: prestation-service
    spec:
      containers:
        - env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: DISCOVERY_SERVICE_URL
              value: http://discovery-service:8761/eureka
            - name: SPRING_APPLICATION_NAME
              value: "prestation"
            - name: SPRING_DATASOURCE_PASSWORD
              value: app_pass
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://billing-db:3306/prestation-db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
            - name: SPRING_DATASOURCE_USERNAME
              value: app_user
            - name: JWK_SET_URL
              value: http://authent-service:3000/api/public-key/jwks.json
          image: prestation-service-image
          imagePullPolicy: IfNotPresent
          name: prestation-service
          ports:
            - containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 40
            timeoutSeconds: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: prestation-service
  name: prestation-service
spec:
  ports:
    - name: http # 🟢 Remplacé "9000" par "http" (valeur textuelle valide)
      port: 9000
      targetPort: 9000
  selector:
    app: prestation-service